# The app's release version - the one place to change it. Semantic versioning:
#   MAJOR - a change that needs a new AOS package (HSMobileOps) deployed alongside it
#   MINOR - new features, compatible with the deployed AOS package
#   PATCH - fixes only
# versionCode is derived from it (MAJOR*10000 + MINOR*100 + PATCH), so a higher version always
# installs over a lower one. MINOR and PATCH stay below 100.
VERSION_MAJOR=1
VERSION_MINOR=5
VERSION_PATCH=2
