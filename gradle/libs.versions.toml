[versions]
agp = "8.7.3"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.28"
hilt = "2.52"
room = "2.6.1"
compose-bom = "2024.12.01"
lifecycle = "2.8.7"
navigation = "2.8.5"
work = "2.10.0"
hilt-work = "1.2.0"
retrofit = "2.11.0"
okhttp = "4.12.0"
serialization = "1.7.3"
retrofit-serialization = "1.0.0"
coroutines = "1.9.0"
security-crypto = "1.1.0-alpha06"
sqlite = "2.4.0"
mlkit-barcode = "17.3.0"
play-integrity = "1.4.0"
camerax = "1.4.1"
biometric = "1.2.0-alpha05"
datastore = "1.1.1"
junit5 = "5.11.3"
junit5-plugin = "1.11.2.0"
mockk = "1.13.13"
turbine = "1.2.0"
truth = "1.4.4"
robolectric = "4.14.1"
androidx-test = "1.7.0"
espresso = "3.7.0"
core-ktx = "1.15.0"
activity-compose = "1.9.3"
timber = "5.0.1"
baselineprofile = "1.3.3"
benchmark = "1.3.3"
profileinstaller = "1.4.1"
uiautomator = "2.3.0"

[libraries]
androidx-core-ktx           = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
androidx-activity-compose   = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
androidx-lifecycle-runtime  = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-compose  = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel= { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-biometric          = { module = "androidx.biometric:biometric-ktx", version.ref = "biometric" }
androidx-datastore          = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

compose-bom          = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui           = { module = "androidx.compose.ui:ui" }
compose-ui-graphics  = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling   = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
compose-material3    = { module = "androidx.compose.material3:material3" }
compose-material-icons = { module = "androidx.compose.material:material-icons-extended" }
compose-navigation   = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }

hilt-android          = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler         = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hilt-work" }
hilt-work             = { module = "androidx.hilt:hilt-work", version.ref = "hilt-work" }
hilt-work-compiler    = { module = "androidx.hilt:hilt-compiler", version.ref = "hilt-work" }

room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx     = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler= { module = "androidx.room:room-compiler", version.ref = "room" }
room-testing = { module = "androidx.room:room-testing", version.ref = "room" }

work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
work-testing = { module = "androidx.work:work-testing", version.ref = "work" }

retrofit              = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-serialization= { module = "com.jakewharton.retrofit:retrofit2-kotlinx-serialization-converter", version.ref = "retrofit-serialization" }
okhttp                = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging        = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
okhttp-mockwebserver  = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }

kotlinx-serialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines    = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

security-crypto = { module = "androidx.security:security-crypto", version.ref = "security-crypto" }
sqlite-ktx      = { module = "androidx.sqlite:sqlite-ktx", version.ref = "sqlite" }

mlkit-barcode = { module = "com.google.mlkit:barcode-scanning", version.ref = "mlkit-barcode" }
play-integrity = { module = "com.google.android.play:integrity", version.ref = "play-integrity" }
camerax-core     = { module = "androidx.camera:camera-core", version.ref = "camerax" }
camerax-camera2  = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
camerax-lifecycle= { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
camerax-view     = { module = "androidx.camera:camera-view", version.ref = "camerax" }

timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }

junit5-api     = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit5" }
junit5-engine  = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit5" }
junit5-params  = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junit5" }
junit4         = { module = "junit:junit", version = "4.13.2" }
junit5-vintage = { module = "org.junit.vintage:junit-vintage-engine", version.ref = "junit5" }
mockk          = { module = "io.mockk:mockk", version.ref = "mockk" }
mockk-android  = { module = "io.mockk:mockk-android", version.ref = "mockk" }
turbine        = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
truth          = { module = "com.google.truth:truth", version.ref = "truth" }
robolectric    = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test" }
espresso-core  = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

androidx-profileinstaller     = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }
androidx-benchmark-macro      = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "benchmark" }
androidx-uiautomator          = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization= { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp                 = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt                = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
junit5              = { id = "de.mannodermaus.android-junit5", version.ref = "junit5-plugin" }
android-test        = { id = "com.android.test", version.ref = "agp" }
baselineprofile     = { id = "androidx.baselineprofile", version.ref = "baselineprofile" }
